services:
  mariadb:
    image: mariadb:latest
    container_name: chat_voice_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chat_voice
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - chat_voice_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_voice_backend
    environment:
      - DATABASE_URL=mysql://root:rootpassword@mariadb:3306/chat_voice
      # You'll need to provide OPENAI_API_KEY through a .env file or environment variable
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - mariadb
    networks:
      - chat_voice_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat_voice_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chat_voice_network

volumes:
  mariadb_data:

networks:
  chat_voice_network:
    driver: bridge