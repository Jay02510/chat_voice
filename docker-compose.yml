services:
  mariadb:
    image: mariadb:latest
    container_name: chat_voice_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: chat_voice
    ports:
      - "127.0.0.1:3306:3306" # loopback-only: local dev access (Prisma CLI/Studio), never public even on a cloud host
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - chat_voice_network

  backend:
    image: jay02510/vodabi-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_voice_backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:${DB_ROOT_PASSWORD}@mariadb:3306/chat_voice
      # You'll need to provide OPENAI_API_KEY through a .env file or environment variable
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000" # loopback-only: direct backend access bypasses nginx/TLS, never public even on a cloud host
    restart: always
    depends_on:
      - mariadb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - chat_voice_network

  frontend:
    image: jay02510/vodabi-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat_voice_frontend
    restart: always
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - chat_voice_network

  caddy:
    image: caddy:2-alpine
    container_name: chat_voice_caddy
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - chat_voice_network

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  chat_voice_network:
    driver: bridge